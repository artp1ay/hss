name: ci

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: gitea-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt & clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.7.3
        with:
          key: gitea-ci-lint

      - name: Rustfmt check
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: |
          set -euo pipefail
          LOCK_ARGS=()
          [[ -f Cargo.lock ]] && LOCK_ARGS=(--locked)
          cargo clippy --workspace --all-targets --all-features "${LOCK_ARGS[@]}" -- -D warnings

  tests:
    name: tests ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.7.3
        with:
          key: gitea-ci-tests

      - name: Cargo test
        shell: bash
        run: |
          set -euo pipefail
          LOCK_ARGS=()
          [[ -f Cargo.lock ]] && LOCK_ARGS=(--locked)
          RUST_TEST_THREADS=1 cargo test --workspace --all-targets --all-features "${LOCK_ARGS[@]}" -- --nocapture

  audit:
    name: security audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Cargo audit (RustSec)
        shell: bash
        run: |
          set -euo pipefail
          [[ -f Cargo.lock ]] || cargo generate-lockfile
          cargo audit
