name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.7.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: RUST_TEST_THREADS=1 cargo test --workspace --all-targets --all-features --locked -- --nocapture

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: hss-linux-x86_64
            cross: false
          - target: aarch64-unknown-linux-musl
            artifact: hss-linux-aarch64
            cross: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.7.3
        with:
          key: ${{ matrix.target }}

      - name: Resolve target version
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if [[ -n "$VERSION" ]]; then
            SEMVER=$(echo "$VERSION" | awk -F. '{printf "%d.%d.%d", $1, $2, $3}')
            sed -i.bak -E "s/^version = \".*\"/version = \"$SEMVER\"/" Cargo.toml
            rm -f Cargo.toml.bak
          fi
      - name: Install build tools
        if: matrix.cross == false
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Stage artifact
        run: cp target/${{ matrix.target }}/release/hss ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v3
      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp hss-linux-x86_64/hss-linux-x86_64 release-assets/
          cp hss-linux-aarch64/hss-linux-aarch64 release-assets/
          cd release-assets
          sha256sum hss-linux-x86_64 hss-linux-aarch64 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create release and upload assets
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_URL: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases
        run: |
          set -euo pipefail
          cd release-assets
          PAYLOAD=$(python3 -c 'import json, os; tag = os.environ["TAG"]; print(json.dumps({"tag_name": tag, "name": tag, "body": "Release " + tag}))')
          RELEASE_ID=$(curl -fsS -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            "$RELEASES_URL" \
            -d "$PAYLOAD" \
            | python3 -c 'import sys, json; release_id = json.load(sys.stdin)["id"]; assert type(release_id) is int and release_id > 0; print(release_id)')
          for f in hss-linux-x86_64 hss-linux-aarch64 SHA256SUMS; do
            curl -fsS -X POST \
              -H "Authorization: token ${TOKEN}" \
              "${RELEASES_URL}/${RELEASE_ID}/assets?name=${f}" \
              -F "attachment=@${f}"
          done
