[package]
name = "hss"
version = "1.0.0"
edition = "2021"
description = "Terminal SSH server manager — TUI, credential storage, Ansible inventory"
license = "MIT"
repository = "https://github.com/artp1ay/hss"

[lib]
name = "hss"
path = "src/lib.rs"

[[bin]]
name = "hss"
path = "src/main.rs"

[[bin]]
name = "generate-assets"
path = "src/bin/generate_assets.rs"
required-features = ["generate-assets"]

[features]
default = []
generate-assets = ["dep:clap_complete", "dep:clap_mangen"]

[dependencies]
anyhow = "1"
base64 = "0.22"
libc = "0.2"
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", optional = true }
clap_mangen = { version = "0.2", optional = true }
crossterm = "0.28"
dirs = "5"
# Linux: постоянное хранилище Secret Service с шифрованием D-Bus; macOS: Keychain.
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "apple-native", "vendored"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
skim = "0.10"
toml = "0.8"
unicode-width = "0.2"
semver = "1.0"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
