name: Auto-format main

# Automatically format main if an unformatted commit lands so style never breaks CI.
on:
  push:
    branches: [main]

concurrency:
  group: autofmt-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all

      - name: Commit formatting changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-format main"
          git fetch origin main
          if ! git rebase origin/main; then
            echo "Branch moved with conflicting changes; newer push will re-run autofmt."
            git rebase --abort || true
            exit 0
          fi
          git push origin main
