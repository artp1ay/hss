name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
      release_notes:
        description: "Release notes / changelog description (optional)"
        required: false
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quality:
    if: github.server_url == 'https://github.com'
    name: quality gate (advisory)
    # Advisory only: a failing lint/test must never block publishing a release.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.7.3
        with:
          key: release-quality

      # A tag can be pushed before autofmt lands: format in the checkout so
      # clippy and tests still run cleanly.
      - name: Normalize formatting
        run: cargo fmt --all

      - name: Clippy
        shell: bash
        run: |
          set -euo pipefail
          LOCK_ARGS=()
          [[ -f Cargo.lock ]] && LOCK_ARGS=(--locked)
          cargo clippy --workspace --all-targets --all-features "${LOCK_ARGS[@]}" -- -D warnings

      - name: Tests
        shell: bash
        run: |
          set -euo pipefail
          LOCK_ARGS=()
          [[ -f Cargo.lock ]] && LOCK_ARGS=(--locked)
          RUST_TEST_THREADS=1 cargo test --workspace --all-targets --all-features "${LOCK_ARGS[@]}" -- --nocapture

  # Generate shell completions and man pages
  generate-assets:
    if: github.server_url == 'https://github.com'
    name: generate shell completions & man pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.7.3
        with:
          key: release-assets

      - name: Generate assets
        run: cargo run --features generate-assets --bin generate-assets -- dist-assets

      - name: Package completions & man page
        run: |
          set -euo pipefail
          tar -czf hss-completions.tar.gz -C dist-assets/completions .
          tar -czf hss-man.tar.gz -C dist-assets/man .

      - uses: actions/upload-artifact@v4
        with:
          name: hss-extra-assets
          if-no-files-found: error
          path: |
            hss-completions.tar.gz
            hss-man.tar.gz
            dist-assets/

  build:
    if: github.server_url == 'https://github.com'
    name: build ${{ matrix.artifact }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: hss-linux-x86_64
            linux_musl: true
            native_smoke_test: true

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: hss-linux-aarch64
            linux_musl: true
            native_smoke_test: true

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: hss-macos-x86_64
            linux_musl: false
            native_smoke_test: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: hss-macos-aarch64
            linux_musl: false
            native_smoke_test: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.7.3
        with:
          key: release-${{ matrix.target }}

      - name: Resolve target version
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          raw = os.environ.get("RAW_TAG", "").strip()
          ver = raw.lstrip("v")
          if not ver:
              raise SystemExit(0)
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", ver):
              raise SystemExit(f"Invalid release version derived from tag: {raw!r}")

          cargo_toml = Path("Cargo.toml")
          lines = cargo_toml.read_text(encoding="utf-8").splitlines(keepends=True)
          in_pkg = False
          updated = False
          for i, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("["):
                  in_pkg = stripped == "[package]"
              elif in_pkg and re.match(r'^version\s*=\s*"[^"]*"', stripped):
                  lines[i] = f'version = "{ver}"\n'
                  updated = True
                  break
          if not updated:
              raise SystemExit("Could not locate [package] version in Cargo.toml")
          cargo_toml.write_text("".join(lines), encoding="utf-8")
          print(f"Updated Cargo.toml [package] version to {ver}")
          PY

      - name: Install Linux musl build tools
        if: matrix.linux_musl == true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends musl-tools
          command -v musl-gcc

      - name: Build binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET"

      - name: Stage and verify binary artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          NATIVE_SMOKE_TEST: ${{ matrix.native_smoke_test }}
        run: |
          set -euo pipefail
          cp "target/${TARGET}/release/hss" "$ARTIFACT"
          chmod +x "$ARTIFACT"
          ls -lh "$ARTIFACT"
          if [[ "$NATIVE_SMOKE_TEST" == "true" ]]; then
            "./${ARTIFACT}" --version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    if: github.server_url == 'https://github.com'
    name: publish release
    needs: [build, generate-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: meta
        shell: bash
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          set -euo pipefail
          TAG="v${RAW_TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ -n "$INPUT_NOTES" ]]; then
            printf '%s\n' "$INPUT_NOTES" > NOTES.md
          else
            git fetch --force origin "+refs/tags/*:refs/tags/*" 2>/dev/null || true
            TAG_MESSAGE=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null | sed '/^$/d' || true)
            if [[ -n "$TAG_MESSAGE" ]]; then
              printf '%s\n' "$TAG_MESSAGE" > NOTES.md
            elif git rev-parse "$TAG" >/dev/null 2>&1; then
              PREV=$(git tag --sort=-version:refname | grep -E '^v[0-9]+' | grep -v "^${TAG}$" | head -1 || true)
              if [[ -n "$PREV" ]] && git rev-parse "$PREV" >/dev/null 2>&1; then
                git log --pretty=format:"- %s" "${PREV}..${TAG}" > NOTES.md || git log --pretty=format:"- %s" -n 50 > NOTES.md
              else
                git log --pretty=format:"- %s" -n 50 > NOTES.md
              fi
            else
              git log --pretty=format:"- %s" -n 50 > NOTES.md
            fi
          fi

          if [[ ! -s NOTES.md ]]; then
            echo "Release ${TAG}" > NOTES.md
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package release archives, assets, and checksums
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Copy standalone binaries (for direct download and hss --update / install.sh)
          cp dist/hss-linux-x86_64/hss-linux-x86_64 release-assets/
          cp dist/hss-linux-aarch64/hss-linux-aarch64 release-assets/
          cp dist/hss-macos-x86_64/hss-macos-x86_64 release-assets/
          cp dist/hss-macos-aarch64/hss-macos-aarch64 release-assets/

          # Copy completions and man pages
          cp dist/hss-extra-assets/hss-completions.tar.gz release-assets/
          cp dist/hss-extra-assets/hss-man.tar.gz release-assets/

          # Create distribution tarballs including README, LICENSE, completions, and man page
          for target in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            pkg_dir="hss-${TAG}-${target}"
            mkdir -p "$pkg_dir"
            cp "release-assets/hss-${target}" "${pkg_dir}/hss"
            cp README.md LICENSE "${pkg_dir}/"
            if [[ -d "dist/hss-extra-assets/dist-assets/completions" ]]; then
              cp -r dist/hss-extra-assets/dist-assets/completions "${pkg_dir}/"
            fi
            if [[ -d "dist/hss-extra-assets/dist-assets/man" ]]; then
              cp -r dist/hss-extra-assets/dist-assets/man "${pkg_dir}/"
            fi
            tar -czf "release-assets/${pkg_dir}.tar.gz" "$pkg_dir"
            rm -rf "$pkg_dir"
          done

          (
            cd release-assets
            ARTIFACTS=(
              hss-linux-x86_64
              hss-linux-aarch64
              hss-macos-x86_64
              hss-macos-aarch64
              hss-completions.tar.gz
              hss-man.tar.gz
              "hss-${TAG}-linux-x86_64.tar.gz"
              "hss-${TAG}-linux-aarch64.tar.gz"
              "hss-${TAG}-macos-x86_64.tar.gz"
              "hss-${TAG}-macos-aarch64.tar.gz"
            )
            sha256sum "${ARTIFACTS[@]}" > SHA256SUMS
            sha256sum --check SHA256SUMS
            md5sum "${ARTIFACTS[@]}" > MD5SUMS
          )

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: NOTES.md
          files: release-assets/*
