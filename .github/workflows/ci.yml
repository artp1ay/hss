name: ci

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: fmt & clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.7.3
        with:
          key: ci-lint

      - name: Rustfmt check
        run: cargo fmt --all -- --check

      - name: Clippy
        shell: bash
        run: |
          set -euo pipefail
          LOCK_ARGS=()
          [[ -f Cargo.lock ]] && LOCK_ARGS=(--locked)
          cargo clippy --workspace --all-targets --all-features "${LOCK_ARGS[@]}" -- -D warnings

  tests:
    name: tests ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.7.3
        with:
          key: ci-tests-${{ matrix.os }}

      - name: Cargo test
        shell: bash
        run: |
          set -euo pipefail
          LOCK_ARGS=()
          [[ -f Cargo.lock ]] && LOCK_ARGS=(--locked)
          RUST_TEST_THREADS=1 cargo test --workspace --all-targets --all-features "${LOCK_ARGS[@]}" -- --nocapture

  audit:
    name: security audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory: transitive RustSec advisories or network hiccups should be visible
    # without blocking routine PRs/pushes. Ignore rules live in .cargo/audit.toml.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Cargo audit (RustSec)
        shell: bash
        run: |
          set -euo pipefail
          [[ -f Cargo.lock ]] || cargo generate-lockfile
          cargo audit
